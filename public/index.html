<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080b16">
  <title>YouTube Music Downloader V2</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="badge">V2 • RÁPIDO • SIMPLE</div>
      <h1>YouTube <span>Music</span> Downloader</h1>
      <p>Analiza, convierte y descarga audio desde una interfaz optimizada para móvil.</p>
    </header>

    <section class="card">
      <label for="url">URL de YouTube</label>
      <div class="url-row">
        <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
        <button id="analyzeBtn" class="secondary">Analizar</button>
      </div>

      <div id="preview" class="preview hidden">
        <img id="thumb" alt="" referrerpolicy="no-referrer">
        <div>
          <strong id="title">Sin título</strong>
          <small id="meta"></small>
        </div>
      </div>

      <div class="grid">
        <div>
          <label for="format">Formato</label>
          <select id="format">
            <option value="mp3">MP3</option>
            <option value="m4a">M4A</option>
            <option value="opus">OPUS</option>
            <option value="wav">WAV</option>
            <option value="vorbis">VORBIS</option>
          </select>
        </div>
        <div>
          <label for="quality">Calidad</label>
          <select id="quality">
            <option value="0">Automática / mejor</option>
            <option value="2">320 kbps aprox.</option>
            <option value="5">192 kbps aprox.</option>
            <option value="9">128 kbps aprox.</option>
          </select>
        </div>
      </div>

      <button id="downloadBtn" class="primary">⬇ Descargar audio</button>
      <p id="message" class="message"></p>
    </section>

    <section class="card">
      <div class="section-head">
        <div>
          <h2>Descarga por lote</h2>
          <p>Una URL por línea.</p>
        </div>
      </div>
      <textarea id="batchUrls" rows="5" placeholder="https://youtu.be/...
https://www.youtube.com/watch?v=..."></textarea>
      <button id="batchBtn" class="secondary full">📦 Procesar lote</button>
    </section>

    <section class="card">
      <div class="section-head">
        <h2>Cola de descargas</h2>
        <span id="queueCount">0</span>
      </div>
      <div id="jobs" class="jobs empty">Todavía no hay trabajos.</div>
    </section>

    <footer>
      Usa el servicio únicamente con contenido que tengas derecho a descargar.
    </footer>
  </main>

  <script src="/app.js"></script>
</body>
</html>
